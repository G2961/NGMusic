name: Build Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # позволяет запускать вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java (нужно для Gradle/Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'   # поставь свою версию, см. flutter --version локально
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release keystore (debug signing if secrets are absent)
        env:
          NGM_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          NGM_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          NGM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NGM_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$NGM_KEYSTORE_B64" ]; then
            echo "KEYSTORE_BASE64 is not set — release APK falls back to debug signing"
            exit 0
          fi
          echo "$NGM_KEYSTORE_B64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$NGM_STORE_PASS
          keyAlias=$NGM_KEY_ALIAS
          keyPassword=$NGM_KEY_PASS
          EOF
          echo "release.keystore restored ($(wc -c < android/app/release.keystore) bytes)"

      - name: Analyze (опционально, но полезно — упадёт при ошибках линта)
        run: flutter analyze
        continue-on-error: true   # убери эту строку если хочешь чтобы линт-ошибки валили билд

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngmusic-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
